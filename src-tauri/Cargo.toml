[package]
name = "squoosh-desktop"
version = "2.0.2"
description = "Squoosh Tool — desktop image compression app"
authors = ["evan-rio"]
edition = "2021"

[lib]
name = "squoosh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
include_dir = "0.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
