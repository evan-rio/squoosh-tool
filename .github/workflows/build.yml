name: Build

on:
  push:
    tags: ['v*']
    # Pushing to this branch runs the full matrix (including the macOS builds
    # that can't be produced on a Windows/Linux machine) and leaves the
    # bundles as downloadable artifacts.
    branches: ['ci']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            label: macos-apple-silicon
            bundles: app,dmg
          # Built on the same arm64 runner: GitHub's Intel macOS runners
          # (macos-13) are scarce and being retired, so we cross-compile.
          - runner: macos-latest
            target: x86_64-apple-darwin
            label: macos-intel
            bundles: app,dmg
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bundles: nsis

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:desktop

      - name: Build bundles
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Resolve version
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Package portable build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Squoosh Tool.app"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "SquooshTool-${VERSION}-${{ matrix.label }}-portable.zip"

      - name: Package portable build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "src-tauri/target/${{ matrix.target }}/release/squoosh-tool.exe" `
            -DestinationPath "SquooshTool-$env:VERSION-${{ matrix.label }}-portable.zip"

      # Tauri names bundles after the build target (e.g. `…_aarch64.dmg`).
      # Ship them under plain-language names instead.
      - name: Rename bundles
        shell: bash
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ -d "$bundle/dmg" ]; then
            for f in "$bundle"/dmg/*.dmg; do
              [ -e "$f" ] && cp "$f" "SquooshTool-${VERSION}-${{ matrix.label }}.dmg"
            done
          fi
          if [ -d "$bundle/nsis" ]; then
            for f in "$bundle"/nsis/*.exe; do
              [ -e "$f" ] && cp "$f" "SquooshTool-${VERSION}-${{ matrix.label }}-setup.exe"
            done
          fi
          ls -la SquooshTool-* || true

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: SquooshTool-${{ matrix.label }}
          path: |
            SquooshTool-*-portable.zip
            SquooshTool-*.dmg
            SquooshTool-*-setup.exe
          if-no-files-found: warn

      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Squoosh Tool ${{ github.ref_name }}
          draft: false
          fail_on_unmatched_files: false
          body: |
            基于 [Squoosh](https://github.com/GoogleChromeLabs/squoosh) 的桌面版图片压缩工具。

            所有压缩都在本机完成，图片不会上传到任何服务器，可完全离线使用。

            ## 功能

            - 支持 MozJPEG、WebP、AVIF、JPEG XL、OxiPNG、WP2、QOI 等编码格式
            - 单图对比压缩：左右并排预览压缩前后效果
            - 批量处理：一次导入多张图片，可选择多张图片或整个文件夹
            - 可设置并发数与 CPU 占用上限
            - 批量结果一键导出到指定文件夹
            - 简体中文 / English 界面切换

            ## 下载

            每个平台提供两种形式：

            - **安装版**：安装到系统，带开始菜单 / 应用程序入口，可正常卸载
            - **便携版**：解压即用，不写入系统、无需安装

            | 平台 | 安装版 | 便携版 |
            | --- | --- | --- |
            | Windows 64 位 | `SquooshTool-<版本>-windows-x64-setup.exe` | `SquooshTool-<版本>-windows-x64-portable.zip` |
            | macOS（Apple Silicon） | `SquooshTool-<版本>-macos-apple-silicon.dmg` | `SquooshTool-<版本>-macos-apple-silicon-portable.zip` |
            | macOS（Intel） | `SquooshTool-<版本>-macos-intel.dmg` | `SquooshTool-<版本>-macos-intel-portable.zip` |

            ## 安装说明

            - **Windows**：运行安装程序即可。若系统缺少 WebView2 运行时，安装过程会自动下载（Windows 10 1803 以上及 Windows 11 通常已内置）。便携版解压后直接运行 `squoosh-tool.exe`。
            - **macOS**：安装包**未做代码签名**，首次打开会提示「无法验证开发者」。请右键点击应用选择「打开」，或在终端执行：

              ```sh
              xattr -dr com.apple.quarantine "/Applications/Squoosh Tool.app"
              ```

            ## 免责声明

            本软件为第三方衍生版本，与 Google 及 Google Chrome Labs 无任何关联，按「现状」提供且不附带任何担保。使用前请阅读仓库中的 [DISCLAIMER.md](https://github.com/evan-rio/squoosh-tool/blob/main/DISCLAIMER.md)。
          files: |
            SquooshTool-*-portable.zip
            SquooshTool-*.dmg
            SquooshTool-*-setup.exe
